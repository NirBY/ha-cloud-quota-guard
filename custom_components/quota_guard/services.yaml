acknowledge_retired:
  fields:
    id:
      required: true
      selector:
        text: {}
configure:
  fields:
    id:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    entry_ids:
      required: true
      selector:
        object: {}
    kind:
      required: true
      selector:
        select:
          options:
          - rate_limit
          - free_allowance
          - budget
    source:
      required: true
      selector:
        text: {}
    unit:
      required: true
      selector:
        text: {}
    usage_entity:
      required: false
      selector:
        entity:
          domain: sensor
    limit_entity:
      required: false
      selector:
        entity:
          domain: sensor
    limit:
      required: false
      selector:
        number:
          min: 1.0e-06
          max: 1000000000000
          mode: box
    period_attribute:
      required: false
      selector:
        text: {}
    timestamp_attribute:
      required: false
      selector:
        text: {}
    max_age:
      required: false
      selector:
        number:
          min: 30
          max: 86400
          unit_of_measurement: s
          mode: box
    enforce:
      required: false
      selector:
        boolean: {}
    usage_url:
      required: false
      selector:
        text: {}
    usage_attribute:
      required: false
      selector:
        text: {}
    period_entity:
      required: false
      selector:
        entity:
          domain: sensor
    timestamp_entity:
      required: false
      selector:
        entity:
          domain: sensor
    period_mode:
      required: false
      selector:
        select:
          options:
          - attribute
          - monthly
          - daily
    period_timezone:
      required: false
      selector:
        text: {}
    warning_percent:
      required: false
      selector:
        number:
          min: 0.01
          max: 100
          step: 0.01
          mode: box
          unit_of_measurement: '%'
    cutoff_percent:
      required: false
      selector:
        number:
          min: 0.01
          max: 100
          step: 0.01
          mode: box
          unit_of_measurement: '%'
    oracle_instance_ids:
      required: false
      selector:
        object: {}
    timestamp_mode:
      required: false
      selector:
        select:
          options:
          - attribute
          - state_reported
    threshold_mode:
      required: false
      selector:
        select:
          options:
          - percent
          - above
          - below
    warning_value:
      required: false
      selector:
        number:
          min: 0
          mode: box
    critical_value:
      required: false
      selector:
        number:
          min: 0
          mode: box
report:
  fields:
    id:
      required: true
      selector:
        text: {}
    used:
      required: true
      selector:
        number:
          min: 0
          max: 1000000000000
          mode: box
    limit:
      required: false
      selector:
        number:
          min: 1.0e-06
          max: 1000000000000
          mode: box
    period:
      required: true
      selector:
        text: {}
    timestamp:
      required: true
      selector:
        text: {}
    expires_at:
      required: false
      selector:
        text: {}
add_dashboard_view:
  name: Add English dashboard view
  description: Append one English quota view to an existing editable dashboard. Existing
    views are preserved.
  fields:
    dashboard_path:
      name: Dashboard URL path
      required: true
      example: dashboard-cloud-quotas
      selector:
        text: null
